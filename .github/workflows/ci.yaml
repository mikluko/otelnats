name: CI

on:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The reference tag is the newest one reachable from HEAD, so the
          # full history and tags need to be here.
          fetch-depth: 0
      - uses: mikluko/action-changelog@v1
        with:
          changelog: CHANGELOG.md
